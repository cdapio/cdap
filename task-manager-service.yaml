apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdap-task-manager
  namespace: default
  labels:
    cdap.service: task.manager
    cdap.instance: shru-basic-rbac-01
spec:
  replicas: 1
  selector:
    matchLabels:
      cdap.service: task.manager
  template:
    metadata:
      labels:
        cdap.service: task.manager
        cdap.instance: shru-basic-rbac-01
    spec:
      serviceAccountName: cdap-shru-basic-rbac-01-system-sa
      containers:
        - name: task-manager
          image: us-east1-docker.pkg.dev/j145774183a931adb-tp/cdf-dev-shru/cloud-data-fusion:latest
          imagePullPolicy: Always
          args:
            - "io.cdap.cdap.master.environment.k8s.TaskManagerMain"
            - "--env=k8s"
          env:
            - name: SERVICE_NAME
              value: task-manager
            - name: OPTS
              value: "-Xmx1024m -XX:MaxDirectMemorySize=768m -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005"
          ports:
            - containerPort: 11025
              name: http
            - containerPort: 5005
              name: debug
          resources:
            requests:
              cpu: "500m"
              memory: "1024Mi"
            limits:
              cpu: "1000m"
              memory: "2048Mi"
          volumeMounts:
            - mountPath: /etc/podinfo
              name: podinfo
              readOnly: true
            - mountPath: /etc/cdap/conf
              name: cdap-conf
              readOnly: true
            - mountPath: /etc/hadoop/conf
              name: hadoop-conf
              readOnly: true
            - mountPath: /etc/cdap/security
              name: cdap-security
              readOnly: true
            - mountPath: /cdap_configmap
              name: cdap-cm-vol-cdap-shru-basic-rbac-01-configmap
      volumes:
        - downwardAPI:
            defaultMode: 420
            items:
              - fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.labels
                path: pod.labels.properties
              - fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
                path: pod.name
              - fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.uid
                path: pod.uid
          name: podinfo
        - configMap:
            defaultMode: 420
            name: cdap-shru-basic-rbac-01-cconf
          name: cdap-conf
        - configMap:
            defaultMode: 420
            name: cdap-shru-basic-rbac-01-hconf
          name: hadoop-conf
        - name: cdap-security
          secret:
            defaultMode: 420
            secretName: cdap-security
        - configMap:
            defaultMode: 420
            name: cdap-shru-basic-rbac-01-configmap
          name: cdap-cm-vol-cdap-shru-basic-rbac-01-configmap
---
apiVersion: v1
kind: Service
metadata:
  name: cdap-task-manager
  namespace: default
spec:
  selector:
    cdap.service: task.manager
  ports:
    - protocol: TCP
      port: 11025
      targetPort: 11025
      name: http
    - protocol: TCP
      port: 5005
      targetPort: 5005
      name: debug
  type: ClusterIP
