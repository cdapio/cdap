name: Report Build Result
on: # zizmor: ignore[dangerous-triggers] -- workflow_run telemetry logger; does not checkout untrusted code
  workflow_run:
    workflows:
      - Build with unit tests
    types:
      - completed
    branches:
      - 'release/**'
      - 'develop'

permissions: {}

jobs:

  report:
    runs-on: cdapio-hub-k8-runner

    steps:
      - name: Write result to BigQuery
        shell: bash
        env:
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          STARTED_AT: ${{ github.event.workflow_run.created_at }}
          ENDED_AT: ${{ github.event.workflow_run.updated_at }}
          HTML_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          BUILD_HISTORY_TABLE: ${{ vars.BUILD_HISTORY_TABLE }}
        run: |
          echo "{ \"repository\": \"$REPO\", \"build_name\": \"$WORKFLOW_NAME\", \"branch\": \"$HEAD_BRANCH\", \"conclusion\": \"$CONCLUSION\", \"started_at\": \"$STARTED_AT\", \"ended_at\": \"$ENDED_AT\", \"url\": \"$HTML_URL\", \"run_id\": \"$RUN_ID\", \"run_attempt\": \"$RUN_ATTEMPT\" }" | bq insert "$BUILD_HISTORY_TABLE"
