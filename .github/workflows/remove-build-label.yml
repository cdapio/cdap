# The `build` label tells the build and build-sonar workflows to run a PR on the
# self-hosted runners. Those workflows trigger on `synchronize`, so a label that
# stays on after new commits are pushed means the later commits build without the
# label being re-applied. This removes the label whenever a PR gets new commits,
# so a maintainer re-adds it once the new commits have been looked at.

name: Remove build label on new commits

on:
  pull_request_target:
    types: [synchronize]

permissions:
  pull-requests: write

jobs:
  remove-build-label:
    runs-on: ubuntu-latest
    if: github.repository == 'cdapio/cdap'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'build',
              });
            } catch (error) {
              // 404 just means the label wasn't on the PR, which is fine.
              if (error.status !== 404) {
                throw error;
              }
            }
