# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven
# Note: Any changes to this workflow would be used only after merging into develop
name: Build with unit tests

on:
  push:
    branches: [ develop, release/** ]
  pull_request:
    branches: [ develop, release/** ]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  build:
    runs-on: k8s-runner-build

    # We allow builds:
    # 1) When it's a merge into a branch
    # 2) For PRs that are labeled as build and
    #  - It's a code change
    #  - A build label was just added
    # A bit complex, but prevents builds when other labels are manipulated
    if: >
      github.event_name == 'push'
      || (contains(github.event.pull_request.labels.*.name, 'build')
         && (github.event.action != 'labeled' || github.event.label.name == 'build')
         )
    steps:
      - name: Set up Spanner Emulator
        run: |
          gcloud config configurations create emulator
          gcloud config set auth/disable_credentials true
          gcloud config set api_endpoint_overrides/spanner http://localhost:9010/
          gcloud config configurations activate emulator
          gcloud emulators spanner start &
          echo "SPANNER_EMULATOR_HOST=localhost:9010" >> $GITHUB_ENV
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 # zizmor: ignore[cache-poisoning] -- Maven test dependency cache; job does not publish release artifacts
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ github.workflow }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ github.workflow }}
      - name: Build with Maven
        # TODO(CDAP-21120): Enable PreviewDataPipelineTest after fixing the flaky test.
        run: mvn clean test -fae -T 2 -B -V -DcloudBuild -Dmaven.wagon.http.retryHandler.count=3 -Dmaven.wagon.httpconnectionManager.ttlSeconds=25 -Dtest='!io.cdap.cdap.datapipeline.preview.PreviewDataPipelineTest,!io.cdap.cdap.test.base.TestFrameworkTestBase,!io.cdap.cdap.datapipeline.ReducibleAggregatorTestBase' -Dsurefire.failIfNoSpecifiedTests=false
      - name: Archive build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reports-${{ github.run_id }}
          path: |
            **/target/rat.txt
            **/target/surefire-reports/*
